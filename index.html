<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ninokuu · Pilih aplikasi</title>
<meta name="description" content="Unduh aplikasi Android Ninokuu (manga, manhwa, manhua) atau NinoNime (jadwal &amp; info anime).">
<meta name="theme-color" content="#0B1018">
<meta property="og:title" content="Ninokuu & NinoNime">
<meta property="og:description" content="Pilih aplikasi yang ingin kamu unduh.">
<meta property="og:image" content="https://ninokuu.site/icon.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<link rel="icon" href="favicon.png">
<style>
  :root { --bg: #0B1018; --s1: #141B27; --line: #273244; --tx: #F2F4F8; --mu: #A3ACBD; --red: #E0242B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--tx);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
    background: radial-gradient(90% 55% at 50% 0%, rgba(224, 36, 43, .22), transparent 70%), var(--bg); }
  main { width: 100%; max-width: 380px; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
  .sub { margin: 0 0 26px; color: var(--mu); font-size: 14.5px; line-height: 1.55; }
  .app { display: flex; align-items: center; gap: 16px; margin-top: 12px; padding: 16px; border-radius: 20px; text-align: left; text-decoration: none; color: var(--tx);
    background: var(--s1); border: 1px solid var(--line); transition: transform .15s, border-color .2s; -webkit-tap-highlight-color: transparent; }
  .app:active { transform: scale(.98); border-color: var(--red); }
  .app img { width: 64px; height: 64px; border-radius: 16px; flex: none; box-shadow: 0 8px 22px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .06); }
  .app b { display: block; font-size: 17px; font-weight: 800; }
  .app span { display: block; margin-top: 3px; color: var(--mu); font-size: 13px; line-height: 1.45; }
  .app svg { margin-left: auto; flex: none; color: var(--mu); }
  footer { margin-top: 28px; color: #5F6878; font-size: 11.5px; }
  footer a { color: var(--tx); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Pilih aplikasi</h1>
  <p class="sub">Mau unduh yang mana?</p>
  <a class="app" href="ninokuu/">
    <img src="icon.png" alt="" width="64" height="64">
    <div><b>Ninokuu</b><span>Baca manga, manhwa &amp; manhua</span></div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
  </a>
  <a class="app" href="ninonime/">
    <img src="ninonime/app/icons/icon-192.png" alt="" width="64" height="64">
    <div><b>NinoNime</b><span>Jadwal &amp; info anime</span></div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
  </a>
  <footer><a href="syarat/">Syarat &amp; Ketentuan</a> · © Ninokuu</footer>
</main>
</body>
</html>
