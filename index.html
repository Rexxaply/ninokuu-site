<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ninokuu · Baca manga, manhwa & manhua</title>
<meta name="description" content="Unduh aplikasi Android Ninokuu untuk membaca manga, manhwa, dan manhua.">
<meta name="theme-color" content="#0B1018">
<meta property="og:title" content="Ninokuu">
<meta property="og:description" content="Unduh aplikasi Android Ninokuu untuk membaca manga, manhwa, dan manhua.">
<meta property="og:image" content="https://ninokuu.site/icon.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src https://api.github.com">
<link rel="icon" href="favicon.png">
<style>
  :root { --bg: #0B1018; --s1: #141B27; --line: #273244; --tx: #F2F4F8; --mu: #A3ACBD; --red: #E0242B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--tx);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
    background: radial-gradient(90% 55% at 50% 0%, rgba(224, 36, 43, .22), transparent 70%), var(--bg); }
  main { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .icon { width: 112px; height: 112px; border-radius: 28px; box-shadow: 0 18px 44px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .06); }
  h1 { margin: 20px 0 6px; font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
  .sub { margin: 0; color: var(--mu); font-size: 14.5px; line-height: 1.55; }
  .btn { margin-top: 28px; width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px;
    border-radius: 18px; background: var(--red); color: #fff; font-size: 16px; font-weight: 800; text-decoration: none;
    box-shadow: 0 10px 28px rgba(224, 36, 43, .35); transition: transform .15s, opacity .2s; -webkit-tap-highlight-color: transparent; }
  .btn:active { transform: scale(.98); }
  .btn.busy { opacity: .6; pointer-events: none; }
  .meta { margin-top: 12px; min-height: 18px; color: var(--mu); font-size: 12.5px; }
  .note { margin-top: 26px; padding: 14px 16px; border-radius: 16px; background: var(--s1); border: 1px solid var(--line);
    color: var(--mu); font-size: 12.5px; line-height: 1.6; text-align: left; }
  footer { margin-top: 28px; color: #5F6878; font-size: 11.5px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="Ikon aplikasi Ninokuu" width="112" height="112">
  <h1>Ninokuu</h1>
  <p class="sub">Baca manga, manhwa &amp; manhua di Android.</p>
  <a class="btn" id="dl" href="https://github.com/Rexxaply/NinoKuu-Manga/releases/download/apk-terbaru/ninokuu.apk" rel="noopener">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
    <span id="dlt">Unduh untuk Android</span>
  </a>
  <div class="meta" id="meta">Android 6 ke atas · gratis</div>
  <div class="note">Setelah unduhan selesai, buka file <b>ninokuu.apk</b>. Bila Android bertanya, izinkan pemasangan dari browser ini.</div>
  <footer>© Ninokuu</footer>
</main>
<script>
  // satu ketukan = satu unduhan: tombol dikunci sebentar supaya tidak memicu unduhan berulang
  const btn = document.getElementById("dl"), txt = document.getElementById("dlt");
  btn.addEventListener("click", (e) => {
    if (btn.classList.contains("busy")) { e.preventDefault(); return; }
    btn.classList.add("busy"); txt.textContent = "Unduhan dimulai…";
    setTimeout(() => { btn.classList.remove("busy"); txt.textContent = "Unduh lagi"; }, 8000);
  });
  // versi & ukuran terbaru dari rilis GitHub (tanpa ini halaman tetap berfungsi)
  fetch("https://api.github.com/repos/Rexxaply/NinoKuu-Manga/releases/tags/apk-terbaru", { headers: { Accept: "application/vnd.github+json" } })
    .then((r) => (r.ok ? r.json() : null)).then((j) => {
      if (!j) return;
      const v = (String(j.name || "").match(/v(\d+\.\d+\.\d+)/) || [])[1];
      const a = (j.assets || []).find((x) => /\.apk$/i.test(x.name));
      const mb = a ? (a.size / 1048576).toFixed(1).replace(".", ",") + " MB" : "";
      document.getElementById("meta").textContent = [v && "Versi " + v, mb, "Android 6 ke atas"].filter(Boolean).join(" · ");
    }).catch(() => {});
</script>
</body>
</html>
