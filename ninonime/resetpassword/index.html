<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buat password baru · NinoNime</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1018">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src https://ocersqyrztzegwzjvvoh.supabase.co; form-action 'none'; base-uri 'none'">
<link rel="icon" href="../icons/icon-192.png">
<style>
  :root { --bg: #0B1018; --s1: #141B27; --line: #273244; --tx: #F2F4F8; --mu: #A3ACBD; --red: #E0242B; --ok: #5DD39E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--tx);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
    background: radial-gradient(90% 55% at 50% 0%, rgba(93, 211, 158, .14), transparent 70%), var(--bg); }
  body.err { background: radial-gradient(90% 55% at 50% 0%, rgba(224, 36, 43, .18), transparent 70%), var(--bg); }
  main { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .icon-wrap { position: relative; }
  .icon { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 18px 44px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .06); }
  .badge { position: absolute; right: -10px; bottom: -10px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--ok); color: #0B1018; border: 4px solid var(--bg); }
  body.err .badge { background: var(--red); color: #fff; }
  h1 { margin: 26px 0 8px; font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  p { margin: 0; color: var(--mu); font-size: 14.5px; line-height: 1.6; }
  .btn { margin-top: 28px; width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px;
    border-radius: 18px; background: var(--red); color: #fff; font-size: 16px; font-weight: 800; text-decoration: none;
    box-shadow: 0 10px 28px rgba(224, 36, 43, .35); -webkit-tap-highlight-color: transparent; }
  .btn:active { transform: scale(.98); }
  .link { margin-top: 14px; color: var(--mu); font-size: 13.5px; font-weight: 600; text-decoration: none; padding: 8px; }
  .hint { margin-top: 18px; padding: 12px 14px; border-radius: 14px; background: var(--s1); border: 1px solid var(--line); font-size: 12.5px; color: var(--mu); line-height: 1.55; }
  .hint a { color: var(--tx); font-weight: 700; }
  form { width: 100%; margin-top: 24px; display: flex; flex-direction: column; gap: 12px; text-align: left; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: var(--mu); }
  input { min-height: 52px; padding: 0 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--s1); color: var(--tx); font: inherit; font-size: 16px; }
  input:focus { outline: 2px solid var(--red); outline-offset: 1px; }
  .show { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; color: var(--mu); }
  .show input { min-height: 0; width: 18px; height: 18px; accent-color: var(--red); }
  .err-t { min-height: 18px; color: #ff6b70; font-size: 13px; font-weight: 600; }
  button.btn { border: 0; font-family: inherit; cursor: pointer; }
  button.btn:disabled { opacity: .6; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="icon-wrap">
    <img class="icon" src="../icons/icon-192.png" alt="NinoNime" width="96" height="96">
    <span class="badge" id="badge" aria-hidden="true" hidden></span>
  </div>
  <h1 id="ttl">Buat password baru</h1>
  <p id="msg">Masukkan password baru untuk akun NinoNime-mu.</p>
  <form id="f" hidden novalidate>
    <label>Password baru<input id="pw" type="password" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Minimal 8 karakter" required></label>
    <label>Ulangi password baru<input id="pw2" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label>
    <label class="show"><input type="checkbox" id="sh">Tampilkan password</label>
    <span class="err-t" id="e" role="alert"></span>
    <button class="btn" id="save" type="submit" style="margin-top:4px">Simpan password</button>
  </form>
  <a class="btn" id="open" href="../#/akun" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
    <span>Kembali ke NinoNime</span>
  </a>
</main>
<script>
  // Tautan "lupa password" dari Supabase membawa token sekali pakai di alamat (#access_token=…&type=recovery).
  // Token hanya disimpan di memori halaman ini, langsung dihapus dari alamat, dan dicabut lagi setelah password disimpan.
  const SB = "https://ocersqyrztzegwzjvvoh.supabase.co", KEY = "sb_publishable_RsXtbJpTDEISJ-q6pKeXdg_oiYaVQa9";
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  if (location.hash || location.search) history.replaceState(null, "", location.pathname);
  const token = q.get("access_token");
  const ICON_OK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4 10-10"/></svg>';
  const ICON_X = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  function done(ok, title, msg) {
    $("f").hidden = true; $("badge").hidden = false; $("badge").innerHTML = ok ? ICON_OK : ICON_X;
    document.body.classList.toggle("err", !ok);
    $("ttl").textContent = title; $("msg").textContent = msg;
    $("open").hidden = false;
  }
  const err = q.get("error_description") || q.get("error");
  if (err || !token) {
    const expired = !token || /expired|invalid|otp/i.test((err || "") + " " + (q.get("error_code") || ""));
    done(false, expired ? "Tautan sudah tidak berlaku" : "Tautan bermasalah",
      expired ? "Tautan reset password ini sudah kedaluwarsa atau sudah pernah dipakai. Minta tautan baru dari aplikasi: halaman masuk → Lupa password?"
        : "Terjadi masalah: " + String(err).replace(/\+/g, " "));
    $("open").href = "../#/akun";
  } else {
    $("f").hidden = false;
    $("pw").focus();
  }
  $("sh").addEventListener("change", (e) => { $("pw").type = $("pw2").type = e.target.checked ? "text" : "password"; });
  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = $("pw").value, pw2 = $("pw2").value;
    $("e").textContent = "";
    if (pw.length < 8) { $("e").textContent = "Password minimal 8 karakter."; return; }
    if (pw !== pw2) { $("e").textContent = "Kedua password tidak sama."; return; }
    $("save").disabled = true; $("save").textContent = "Menyimpan…";
    try {
      const r = await fetch(SB + "/auth/v1/user", { method: "PUT", headers: { apikey: KEY, Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: JSON.stringify({ password: pw }) });
      if (!r.ok) {
        let m = ""; try { const j = await r.json(); m = j.msg || j.message || j.error_description || j.error || ""; } catch {}
        if (r.status === 401 || /expired|invalid/i.test(m)) { done(false, "Tautan sudah tidak berlaku", "Sesi reset password sudah berakhir. Minta tautan baru dari aplikasi: halaman masuk → Lupa password?"); return; }
        if (/same|different from the old/i.test(m)) throw new Error("Password baru harus berbeda dari password lama.");
        if (/weak|least/i.test(m)) throw new Error("Password terlalu lemah. Pakai minimal 8 karakter, campur huruf dan angka.");
        throw new Error(m || "Gagal menyimpan (HTTP " + r.status + ").");
      }
      // token reset tidak dipakai lagi: cabut sesi di halaman ini (sesi di aplikasi tidak terpengaruh)
      fetch(SB + "/auth/v1/logout?scope=local", { method: "POST", headers: { apikey: KEY, Authorization: "Bearer " + token } }).catch(() => {});
      done(true, "Password berhasil diganti", "Kembali ke NinoNime lalu masuk dengan password barumu.");
    } catch (x) {
      $("e").textContent = x.message || "Tidak ada koneksi internet. Coba lagi.";
      $("save").disabled = false; $("save").textContent = "Simpan password";
    }
  });
</script>
</body>
</html>
